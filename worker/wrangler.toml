name = "charla-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Without this the JSON lines the Worker logs (token counts, cache hits, stop
# reasons) exist only inside a live `wrangler tail` and answer nothing later.
[observability]
enabled = true
head_sampling_rate = 1

# public/venues.geojson is imported as text so /api/report can refuse a place id
# the map does not show. esbuild only knows .json on its own; this names .geojson.
[[rules]]
type = "Text"
globs = ["**/*.geojson"]
fallthrough = true

[vars]
# claude-opus-5 accepts mid-conversation system messages, which is where the
# per-turn level reminder goes, and its prompt cache minimum is 512 tokens,
# which our ~700-token system prompt clears.
#
# claude-sonnet-5 is the cost fallback, but read this before switching: Sonnet's
# cache minimum is 1024 tokens, so the system prompt falls UNDER it and caching
# silently stops (no error, cache_creation_input_tokens just stays 0). The real
# saving is therefore smaller than the per-token price difference suggests.
# Check res.usage.cache_read_input_tokens in the logs either way. Sonnet also
# rejects mid-conversation system messages; tutor.ts handles that automatically.
MODEL = "claude-opus-5"
# Used only when ANTHROPIC_API_KEY is not set: the partner and the Table-mode
# helper run on this Workers AI model instead (free tier). Same prompts, same
# JSON schema, same drift guard. Add the key and Claude takes over on the
# next request; nothing else changes.
FALLBACK_MODEL = "@cf/openai/gpt-oss-120b"
# Per device per Chicago day. Turns (/api/turn, /api/help, /api/flag) share one
# counter; speech (/api/stt) has its own, so a spoken turn costs one of each,
# not two turns. Both have a per-IP twin (DAILY_IP_CAP for turns, a fixed 600
# for speech) that a script minting fresh device ids cannot get around.
DAILY_TURN_CAP = "40"
DAILY_IP_CAP = "400"
DAILY_STT_CAP = "60"
# The partner's voice (worker/src/tts.ts). TTS_MODEL is the natural one and
# costs about 130 neurons a reply; TTS_BUDGET_MODEL costs about one. The free
# tier's 10,000 neurons a day are shared with the partner and with Whisper, so
# the natural voice reads only the first DAILY_TTS_PREMIUM clips of the day,
# across everyone. On a paid plan, raise it (e.g. "100000") and it reads all.
TTS_MODEL = "@cf/deepgram/aura-2-{lang}"
TTS_BUDGET_MODEL = "@cf/myshell-ai/melotts"
DAILY_TTS_PREMIUM = "40"
DAILY_TTS_CAP = "200"
# The deployed app origin, e.g. "https://charla.pages.dev". A POST whose Origin
# header is anything else is answered 403 before any counter or model call; a
# request with no Origin header (curl, the tests) is not a browser and passes.
# Left empty, no allow-origin header is sent at all and every browser POST is
# refused. For local dev, put ALLOWED_ORIGIN=http://localhost:5173 in
# worker/.dev.vars so the Vite proxy's requests are accepted.
ALLOWED_ORIGIN = "https://charla-naperville.pages.dev"

# Create this once, then paste the id:
#   wrangler d1 create charla
# Caps live in D1 too (see src/caps.ts); there is no KV namespace.
[[d1_databases]]
binding = "DB"
database_name = "charla"
database_id = "65e4b78a-2185-4faa-81fa-8f2916784c95"

# Workers AI: Whisper for /api/stt, and the FALLBACK_MODEL partner when there is
# no Anthropic key. Local `wrangler dev` proxies this binding to the real
# service, so it needs `wrangler login` first (and counts against the free tier).
[ai]
binding = "AI"

# Secrets (never in this file):
#   wrangler secret put ANTHROPIC_API_KEY --config worker/wrangler.toml
# For local dev put ANTHROPIC_API_KEY=... in worker/.dev.vars (gitignored).
